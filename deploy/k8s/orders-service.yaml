apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-service
  namespace: apiway
  labels: { app: orders-service }
spec:
  replicas: 1
  selector:
    matchLabels: { app: orders-service }
  template:
    metadata:
      labels: { app: orders-service }
    spec:
      containers:
        - name: orders-service
          image: ghcr.io/Anhedonicc/apiway/orders-service:latest
          ports:
            - containerPort: 9100
          readinessProbe:
            httpGet: { path: /healthz, port: 9100 }
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { cpu: 500m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: orders-service
  namespace: apiway
spec:
  selector: { app: orders-service }
  ports:
    - port: 9100
      targetPort: 9100
