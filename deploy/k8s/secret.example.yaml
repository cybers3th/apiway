# Example only. Do NOT commit real secrets. Create the real one with:
#   kubectl -n apiway create secret generic apiway-secrets \
#     --from-literal=JWT_SECRET="$(openssl rand -hex 32)"
apiVersion: v1
kind: Secret
metadata:
  name: apiway-secrets
  namespace: apiway
type: Opaque
stringData:
  JWT_SECRET: change-me-to-a-long-random-secret
