apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  namespace: apiway
data:
  config.yaml: |
    server:
      addr: ":8080"
    jwt:
      secret_env: JWT_SECRET
      issuer: auth-service
    rate_limit:
      default:
        rps: 20
        burst: 40
    routes:
      - path_prefix: /auth
        upstream: http://auth-service:9000
        auth: false
        rate_limit: { rps: 5, burst: 10 }
      - path_prefix: /api/orders
        upstream: http://orders-service:9100
        auth: true
        required_permissions: [orders:read]
        method_permissions:
          POST: [orders:write]
          PUT: [orders:write]
          DELETE: [orders:write]
      - path_prefix: /api/catalog
        upstream: http://catalog-service:9200
        auth: true
        allow_api_key: true
        required_permissions: [catalog:read]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: apiway
  labels: { app: gateway }
spec:
  replicas: 2
  selector:
    matchLabels: { app: gateway }
  template:
    metadata:
      labels: { app: gateway }
    spec:
      containers:
        - name: gateway
          image: ghcr.io/Anhedonicc/apiway/gateway:latest
          ports:
            - containerPort: 8080
          env:
            - name: GATEWAY_CONFIG
              value: /etc/apiway/config.yaml
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: apiway-secrets
                  key: JWT_SECRET
          volumeMounts:
            - name: config
              mountPath: /etc/apiway
              readOnly: true
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 3
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 5
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { cpu: 500m, memory: 128Mi }
      volumes:
        - name: config
          configMap:
            name: gateway-config
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: apiway
spec:
  selector: { app: gateway }
  ports:
    - port: 8080
      targetPort: 8080
